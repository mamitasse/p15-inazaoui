name: CI Symfony

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    name: Tests and static checks
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: p15_inazaoui_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: test
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/p15_inazaoui_test?serverVersion=8.0

    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      - name: Installation de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql
          coverage: none

      - name: Installation des dépendances Composer
        run: composer install --no-interaction --prefer-dist

      - name: Vérification syntaxe YAML
        run: php bin/console lint:yaml config

      - name: Vérification syntaxe Twig
        run: php bin/console lint:twig templates

      - name: Création de la base de test
        run: php bin/console doctrine:database:create --if-not-exists --env=test

      - name: Exécution des migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Chargement des fixtures
        run: php bin/console doctrine:fixtures:load --no-interaction --env=test

      - name: Lancement des tests PHPUnit
        run: php bin/phpunit